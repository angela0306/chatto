<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Chatto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#bfe3da;
    --bg2:#a7c9d6;
    --bg3:#cddcc2;
    --ink:#193331;
    --ink-soft:#3c5250;
    --glass:rgba(255,255,255,0.20);
    --glass-strong:rgba(255,255,255,0.32);
    --glass-border:rgba(255,255,255,0.45);
    --glass-shadow:rgba(20,50,48,0.18);
    --accent-red:#e2564a;
    --accent-green:#49a67d;
    --accent-orange:#e2a23b;
    --accent-stamp:#a8443a;
    --radius:20px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --display:'Space Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--display);
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.5), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.35), transparent 50%),
      linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* ---------- Identity Gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, var(--bg1), var(--bg2) 60%, var(--bg3));
  }
  #gate .card{
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:24px;
    padding:36px 32px;
    width:min(340px, 88vw);
    text-align:center;
    box-shadow:0 20px 60px var(--glass-shadow);
  }
  #gate h1{
    font-size:22px; letter-spacing:0.06em; margin:0 0 4px;
    font-weight:700;
  }
  #gate p{
    margin:0 0 24px; font-size:13px; color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .id-btn{
    display:block; width:100%; padding:14px 16px; margin-bottom:12px;
    border-radius:14px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.35); color:var(--ink);
    font-family:var(--display); font-weight:600; font-size:15px;
    cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .id-btn:hover{ background:rgba(255,255,255,0.55); transform:translateY(-1px); }
  .id-btn:active{ transform:translateY(0); }
  #email-input{
    display:block; width:100%; padding:13px 14px; margin-bottom:10px;
    border-radius:14px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.45); color:var(--ink);
    font-family:var(--mono); font-size:14px; outline:none;
  }
  #email-input:focus{ background:rgba(255,255,255,0.65); }
  #email-error{
    color:var(--accent-stamp); font-family:var(--mono); font-size:11.5px;
    margin:-4px 0 12px; display:none; text-align:left; line-height:1.5;
  }
  #email-hint{
    font-family:var(--mono); font-size:10.5px; color:var(--ink-soft);
    opacity:.7; margin-top:14px; line-height:1.6;
  }

  /* ---------- Mode tabs ---------- */
  #mode-tabs{
    display:flex; gap:6px; padding:10px 16px 0;
    background:var(--glass); border-bottom:1px solid var(--glass-border);
  }
  .tab-btn{
    flex:1; padding:9px 10px 11px; border:none; background:none;
    font-family:var(--display); font-weight:600; font-size:12.5px;
    color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .tab-btn:hover{ color:var(--ink); }

  /* ---------- App shell ---------- */
  #app{
    display:none;
    width:min(560px, 100vw);
    height:100vh; height:100dvh;
    max-height:900px;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:640px){
    #app{ height:min(860px, 92vh); margin:16px; border-radius:28px; overflow:hidden; box-shadow:0 30px 80px var(--glass-shadow); }
  }

  /* header */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    background:var(--glass);
    border-bottom:1px solid var(--glass-border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    position:relative; z-index:5;
  }
  #topbar .title-wrap{ display:flex; align-items:center; gap:10px; }
  #topbar h1{ font-size:16px; letter-spacing:0.12em; margin:0; font-weight:700; text-transform:uppercase; }
  .dot{ width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,0.4); animation:breathe 2.6s ease-in-out infinite; }
  .dot.online{ background:var(--accent-green); }
  .dot.alone{ background:var(--accent-orange); }
  @keyframes breathe{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  #topbar .tools{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px; color:var(--ink); transition:background .15s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.55); }
  .whoami{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); letter-spacing:.06em; }

  /* chat scroll / tape */
  #tape-wrap{
    flex:1; position:relative; overflow:hidden;
  }
  #tape-wrap::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:14px;
    background:
      radial-gradient(circle at 10px 7px, transparent 6px, var(--bg2) 6.5px) ,
      repeating-linear-gradient(90deg, var(--bg2) 0 20px, transparent 20px 22px);
    z-index:3; opacity:.55;
  }
  #tape{
    height:100%; overflow-y:auto; padding:26px 16px 12px;
    display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  #tape::-webkit-scrollbar{ width:6px; }
  #tape::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.5); border-radius:6px; }

  .empty-state{
    margin:auto; text-align:center; color:var(--ink-soft);
    font-family:var(--mono); font-size:12.5px; line-height:1.8; padding:40px 20px;
  }

  /* message row */
  .row{ display:flex; flex-direction:column; max-width:82%; }
  .row.self{ align-self:flex-end; align-items:flex-end; }
  .row.other{ align-self:flex-start; align-items:flex-start; }
  .row.new-in{ animation:tapein .35s ease; }
  @keyframes tapein{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .meta-line{
    font-family:var(--mono); font-size:10px; letter-spacing:.05em;
    color:var(--ink-soft); margin-bottom:4px; opacity:.75;
    display:flex; gap:8px; align-items:center;
  }
  .row.self .meta-line{ flex-direction:row-reverse; }

  .reply-chip{
    font-family:var(--mono); font-size:10.5px; color:var(--ink-soft);
    background:rgba(255,255,255,0.28); border:1px solid var(--glass-border);
    border-radius:10px; padding:4px 9px; margin-bottom:5px; cursor:pointer;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .reply-chip:hover{ background:rgba(255,255,255,0.45); }

  .bubble{
    position:relative;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:var(--radius);
    padding:12px 14px 10px;
    box-shadow:0 8px 24px var(--glass-shadow);
  }
  .row.self .bubble{ border-bottom-right-radius:6px; background:rgba(255,255,255,0.34); }
  .row.other .bubble{ border-bottom-left-radius:6px; }

  .bubble.system-text{
    font-family:var(--mono); font-size:12px; color:var(--ink-soft); font-style:italic;
  }

  .glyph-row{ display:flex; flex-wrap:wrap; gap:2px; align-items:center; }
  .glyph{
    position:relative; width:30px; height:34px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .glyph img{
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.12));
    transition:opacity .25s ease, filter .25s ease;
  }
  .glyph .letter{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:600; font-size:15px; color:var(--ink);
    opacity:0; transition:opacity .25s ease;
  }
  .glyph:hover img, .glyph.reveal img{ opacity:.12; filter:blur(1.5px); }
  .glyph:hover .letter, .glyph.reveal .letter{ opacity:1; }
  .glyph.space{ width:10px; }
  .glyph.plain{
    font-family:var(--mono); font-size:15px; color:var(--ink-soft); width:auto; padding:0 2px;
  }

  .foot-line{
    display:flex; align-items:center; gap:6px; margin-top:6px;
    font-family:var(--mono); font-size:9.5px; color:var(--ink-soft);
  }
  .row.self .foot-line{ flex-direction:row-reverse; }
  .read-dot{ width:6px; height:6px; border-radius:50%; }
  .read-dot.unread{ background:var(--accent-red); }
  .read-dot.read{ background:var(--accent-green); }
  .stamp{
    display:inline-block; font-family:var(--mono); font-size:9px; font-weight:600;
    color:var(--accent-stamp); border:1.5px solid var(--accent-stamp);
    border-radius:5px; padding:1px 5px; transform:rotate(-6deg);
    letter-spacing:.08em;
  }
  .edited-tag{ opacity:.7; }

  .actions{
    display:flex; gap:4px; margin-top:6px; opacity:0; transition:opacity .15s ease;
    pointer-events:none;
  }
  .row:hover .actions, .row.touch-active .actions{ opacity:1; pointer-events:auto; }
  .row.self .actions{ flex-direction:row-reverse; }
  .act-btn{
    font-family:var(--mono); font-size:9.5px; color:var(--ink-soft);
    background:rgba(255,255,255,0.35); border:1px solid var(--glass-border);
    border-radius:8px; padding:3px 7px; cursor:pointer;
  }
  .act-btn:hover{ background:rgba(255,255,255,0.6); color:var(--ink); }

  /* ---------- Reply/Edit preview bar ---------- */
  #context-bar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 16px; background:rgba(255,255,255,0.35);
    border-top:1px solid var(--glass-border);
    font-family:var(--mono); font-size:11px; color:var(--ink-soft);
  }
  #context-bar span.label{ font-weight:600; color:var(--ink); margin-right:6px; }
  #context-bar button{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; line-height:1;
  }

  /* ---------- Input dock ---------- */
  #dock{
    background:var(--glass-strong);
    border-top:1px solid var(--glass-border);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    padding:10px 14px 14px;
  }
  #preview-row{
    min-height:40px; display:flex; align-items:center; gap:2px; flex-wrap:wrap;
    padding:6px 10px; margin-bottom:8px;
    background:rgba(255,255,255,0.3); border:1px dashed var(--glass-border);
    border-radius:14px;
  }
  #preview-row.empty::before{
    content:"你打的字會即時變成暗號…";
    font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); opacity:.65;
  }
  #input-line{ display:flex; align-items:flex-end; gap:8px; }
  #text-input{
    flex:1; resize:none; border:1px solid var(--glass-border); border-radius:16px;
    padding:11px 14px; font-family:var(--display); font-size:14.5px; color:var(--ink);
    background:rgba(255,255,255,0.4); outline:none; max-height:100px; line-height:1.4;
  }
  #text-input:focus{ background:rgba(255,255,255,0.6); }
  #send-btn{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--glass-border);
    background:linear-gradient(160deg, #33544f, #1c3a37);
    color:#eafaf3; font-size:18px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(20,50,48,0.35);
    transition:transform .12s ease;
  }
  #send-btn:hover{ transform:translateY(-2px); }
  #send-btn:active{ transform:translateY(0) scale(.94); }

  /* ---------- Codebook modal ---------- */
  #codebook-overlay{
    display:none; position:fixed; inset:0; z-index:60;
    background:rgba(15,35,33,0.45); align-items:center; justify-content:center; padding:20px;
  }
  #codebook{
    background:var(--glass-strong); border:1px solid var(--glass-border);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:22px; padding:20px; width:min(460px, 100%); max-height:80vh; overflow-y:auto;
    box-shadow:0 30px 70px rgba(0,0,0,0.3);
  }
  #codebook h2{ margin:0 0 4px; font-size:15px; letter-spacing:.08em; }
  #codebook p{ margin:0 0 14px; font-size:11.5px; color:var(--ink-soft); font-family:var(--mono); }
  .codebook-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  .codebook-cell{
    background:rgba(255,255,255,0.35); border:1px solid var(--glass-border);
    border-radius:10px; padding:6px 2px; text-align:center;
  }
  .codebook-cell img{ width:100%; height:30px; object-fit:contain; }
  .codebook-cell span{ display:block; font-family:var(--mono); font-size:10px; margin-top:2px; color:var(--ink-soft); }
  #codebook-close{
    margin-top:14px; width:100%; padding:10px; border-radius:12px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.4); font-family:var(--display); font-weight:600; cursor:pointer;
  }

  /* ---------- Google gate ---------- */
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:13px 16px; border-radius:14px;
    border:1px solid var(--glass-border); background:rgba(255,255,255,0.6);
    color:var(--ink); font-family:var(--display); font-weight:600; font-size:15px; cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .google-btn:hover{ background:rgba(255,255,255,0.85); transform:translateY(-1px); }
  .google-btn svg{ width:18px; height:18px; }

  /* ---------- Normal chat ---------- */
  #chatapp{
    display:none; width:min(560px, 100vw); height:100vh; height:100dvh; max-height:900px;
    flex-direction:column; position:relative;
  }
  @media (min-width:640px){
    #chatapp{ height:min(860px, 92vh); margin:16px; border-radius:28px; overflow:hidden; box-shadow:0 30px 80px var(--glass-shadow); }
  }
  .cn-top{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    background:var(--glass); border-bottom:1px solid var(--glass-border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .cn-title-wrap{ display:flex; align-items:center; gap:10px; }
  .cn-avatar{
    width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.55);
    border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px;
  }
  .cn-top h1{ font-size:16px; margin:0; font-weight:700; }
  .cn-tools{ display:flex; align-items:center; gap:8px; }
  .cn-tape-wrap{ flex:1; position:relative; overflow:hidden; }
  #cn-tape{
    height:100%; overflow-y:auto; padding:16px 14px 10px;
    display:flex; flex-direction:column; gap:10px;
  }
  #cn-tape::-webkit-scrollbar{ width:6px; }
  #cn-tape::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.5); border-radius:6px; }
  .cn-empty{ margin:auto; color:var(--ink-soft); font-size:13px; opacity:.8; }
  .cn-day{
    align-self:center; font-size:11px; color:var(--ink-soft); background:rgba(255,255,255,0.3);
    border-radius:10px; padding:3px 10px; margin:6px 0;
  }
  .cn-row{ display:flex; flex-direction:column; max-width:78%; }
  .cn-row.self{ align-self:flex-end; align-items:flex-end; }
  .cn-row.other{ align-self:flex-start; align-items:flex-start; }
  .cn-row.new-in{ animation:tapein .3s ease; }
  .cn-bubble{
    background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:18px; padding:9px 14px; font-size:14.5px; line-height:1.5;
    box-shadow:0 6px 18px var(--glass-shadow); word-break:break-word; white-space:pre-wrap;
  }
  .cn-row.self .cn-bubble{ background:rgba(255,255,255,0.5); border-bottom-right-radius:6px; }
  .cn-row.other .cn-bubble{ border-bottom-left-radius:6px; }
  .cn-meta{ font-size:10px; color:var(--ink-soft); margin-top:3px; opacity:.75; }
  .cn-reply{
    font-size:11px; color:var(--ink-soft); background:rgba(255,255,255,0.28);
    border:1px solid var(--glass-border); border-radius:10px; padding:4px 9px; margin-bottom:4px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
  }
  .cn-actions{ display:flex; gap:4px; margin-top:4px; opacity:0; pointer-events:none; transition:opacity .15s; }
  .cn-row:hover .cn-actions, .cn-row.open .cn-actions{ opacity:1; pointer-events:auto; }
  #cn-ctx{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 16px; background:rgba(255,255,255,0.35); border-top:1px solid var(--glass-border);
    font-size:12px; color:var(--ink-soft);
  }
  #cn-ctx .label{ font-weight:600; color:var(--ink); margin-right:6px; }
  #cn-ctx button{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; }
  .cn-dock{
    display:flex; align-items:flex-end; gap:8px; padding:10px 14px 14px;
    background:var(--glass-strong); border-top:1px solid var(--glass-border);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  #cn-input{
    flex:1; resize:none; border:1px solid var(--glass-border); border-radius:16px;
    padding:11px 14px; font-family:var(--display); font-size:14.5px; color:var(--ink);
    background:rgba(255,255,255,0.4); outline:none; max-height:100px; line-height:1.4;
  }
  #cn-input:focus{ background:rgba(255,255,255,0.6); }
  #cn-send{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-border);
    background:linear-gradient(160deg,#4a8a86,#2f6662); color:#fff; font-size:17px; cursor:pointer; flex:none;
  }

  /* ---------- password box ---------- */
  #pw-overlay{
    display:none; position:fixed; inset:0; z-index:70; background:rgba(15,35,33,0.25);
    align-items:center; justify-content:center; padding:20px;
  }
  #pw-box{
    background:var(--glass-strong); border:1px solid var(--glass-border);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:18px; padding:14px; width:min(260px, 100%);
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  #pw-input{
    width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.6); font-size:15px; font-family:var(--mono); outline:none; text-align:center;
    letter-spacing:.2em;
  }
  #pw-box.shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }

  /* ---------- Messenger screens ---------- */
  .scr{ display:none; flex:1; min-height:0; flex-direction:column; }
  .scr.show{ display:flex; }
  .cn-tape-wrap{ min-height:0; }
  .sub{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); opacity:.8; }
  .setup-card{
    margin:auto; width:min(340px, 88%); background:var(--glass-strong);
    border:1px solid var(--glass-border); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:24px; padding:28px 24px; box-shadow:0 20px 60px var(--glass-shadow);
  }
  .setup-card h2{ margin:0 0 6px; font-size:19px; }
  .setup-card p{ margin:0 0 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .setup-card label{ display:block; font-size:12px; font-weight:600; margin:10px 0 5px; }
  .setup-card input, .list-search input, #nc-input{
    width:100%; padding:11px 14px; border-radius:14px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.5); font-size:14.5px; font-family:var(--display); color:var(--ink); outline:none;
  }
  .setup-card input:focus, .list-search input:focus, #nc-input:focus{ background:rgba(255,255,255,0.75); }

<div id="gate">
  <div class="card">
    <h1>Chatto</h1>

      使用 Google 登入

</div>

<div id="chatapp">

      <input id="su-nick" maxlength="20" placeholder="例如：小明">

    <button class="tab-nav" data-tab="water">🌊 水波</button>
  </div>
</div>

<div id="newchat-overlay">
  <div id="newchat-box">
    <div class="nc-tabs">
      <button class="nc-tab active" data-nc="find">找人</button>
      <button class="nc-tab" data-nc="create">建立聊天室</button>
      <button class="nc-tab" data-nc="explore">探索</button>

    <div class="nc-pane" id="nc-find">
      <p>輸入對方的使用者 ID，開始一對一聊天。</p>
      <div class="nc-row"><input id="nc-input" placeholder="@使用者ID" autocapitalize="none" autocomplete="off"><button id="nc-search">搜尋</button></div>
      <div id="nc-msg"></div>
      <div id="nc-result"></div>
    </div>
    <div class="nc-pane" id="nc-create">
      <input id="rm-name" maxlength="40" placeholder="聊天室名稱">
      <label class="opt"><input type="radio" name="rmvis" value="public" checked><span>公開<small>所有人都能在「探索」找到並加入</small></span></label>
      <label class="opt"><input type="radio" name="rmvis" value="private"><span>私人<small>只有被邀請的成員才進得來</small></span></label>
      <div id="rm-msg"></div>
      <button id="rm-create">建立</button>
    </div>
    <div class="nc-pane" id="nc-explore">
      <input id="ex-filter" placeholder="搜尋公開聊天室">
      <div id="ex-msg"></div>
      <div id="ex-list"></div>
    </div>
  </div>
</div>

<div id="members-overlay">
  <div id="members-box">
    <h2>聊天室成員</h2>
    <div id="mb-list"></div>
    <button id="mb-close">關閉</button>
  </div>
</div>
<div id="toast"></div>

<div id="app">
  <div id="topbar">
    <div class="title-wrap">
      <span class="dot alone" id="presence-dot"></span>
      <h1>Secret Channel</h1>
    </div>
    <div class="tools">
      <span class="whoami" id="whoami-label"></span>
      <div class="icon-btn" id="logout-btn" title="返回聊天室">⎋</div>
      <div class="icon-btn" id="sound-toggle" title="音效開關">♪</div>
      <div class="icon-btn" id="codebook-btn" title="暗號表">A→𝕏</div>
    </div>
  </div>

  <div id="mode-tabs">
    <button class="tab-btn active" data-mode="chat">💬 聊天室</button>
    <button class="tab-btn" data-mode="telegram">📡 電報</button>
  </div>

  <div id="tape-wrap">
    <div id="tape"></div>
  </div>

  <div id="context-bar">
    <div><span class="label" id="context-label"></span><span id="context-text"></span></div>
    <button id="context-cancel">✕</button>
  </div>

  <div id="dock">
    <div id="preview-row" class="empty"></div>
    <div id="input-line">
      <textarea id="text-input" rows="1" placeholder="輸入電文… (Enter 發送 / Shift+Enter 換行)"></textarea>
      <button id="send-btn" title="發送電報">➤</button>
    </div>
  </div>
</div>

<div id="codebook-overlay">
  <div id="codebook">
    <h2>跳舞火柴人暗號表</h2>
    <p>你們兩人專屬的密碼本，僅供自己核對用。</p>
    <div class="codebook-grid" id="codebook-grid"></div>
    <button id="codebook-close">關閉</button>
  </div>
</div>

const MESSAGES_COLLECTION = "sc_messages";

function resolveUserByEmail(raw){
  const e = (raw || '').trim().toLowerCase();
  for(const name of Object.keys(EMAIL_MAP)){
    if(EMAIL_MAP[name].some(addr => addr.toLowerCase() === e)) return name;
  }
  return null;
}

/* ---------------- firestore helpers ---------------- */
function msgsRef(){
  const { db, collection } = window.__fb;
  return collection(db, MESSAGES_COLLECTION);
}
function msgDoc(id){
  const { db, doc } = window.__fb;
  return doc(db, MESSAGES_COLLECTION, id);
}
function presenceDoc(name){
  const { db, doc } = window.__fb;
  return doc(db, PRESENCE_COLLECTION, name);
}
async function updateDocSafe(id, patch){
  try{ await window.__fb.updateDoc(msgDoc(id), patch); }
  catch(e){ console.error('update failed', e); }
}

function startMessagesListener(){
  const { onSnapshot, query, orderBy } = window.__fb;
  const q = query(msgsRef(), orderBy('timestamp'));
  unsubscribeMessages = onSnapshot(q, (snap)=>{
    messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    processLifecycle();
    render();
  }, (err)=>{
    console.error('messages listener error', err);
  });
}

/* ---------------- lifecycle logic ---------------- */
function processLifecycle(){
  const now = Date.now();
  for(const m of messages){
    if(m.sender !== currentUser && !m.isRead && m.status === 'active'){
      updateDocSafe(m.id, { isRead:true, readAt: new Date().toISOString() });
    }
  }
  for(const m of messages){
    if(m.mode === 'telegram' && m.status === 'active' && m.isRead && !m.isSaved && m.readAt){
      if(now - new Date(m.readAt).getTime() > DAY_MS){
        updateDocSafe(m.id, { status:'destroyed', text:'' });
      }
    }
  }
}

/* ---------------- cipher rendering ---------------- */
function renderCipherHTML(text){
  let html = '';
  for(const raw of text){
    const ch = raw.toUpperCase();
    if(ch === ' '){
      html += `<span class="glyph space"></span>`;
    }else if(ALPHABET.includes(ch)){
      html += `<span class="glyph" data-letter="${ch}">
        <img src="${GLYPHS[ch]}" alt="${ch}" draggable="false">
        <span class="letter">${ch}</span>
      </span>`;
    }else{
      html += `<span class="glyph plain">${escapeHTML(raw)}</span>`;
    }
  }
  return html;
}
function escapeHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------- sound ---------------- */
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
}
function tick(freq, dur, type){
  if(!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function playKeyTick(){ tick(1400 + Math.random()*200, 0.045, 'square'); }
function playSendSound(){ tick(700, 0.09, 'sine'); setTimeout(()=>tick(1000,0.12,'sine'), 70); }

/* ---------------- render ---------------- */
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});
}
function seqLabel(idx, mode){
  if(mode === 'telegram') return 'TELEGRAM #' + String(idx+1).padStart(4,'0');
  return '#' + String(idx+1).padStart(4,'0');
}

function findMessage(id){ return messages.find(m => m.id === id); }

function render(){
  const tape = document.getElementById('tape');
  const visible = messages
    .filter(m => (m.mode || 'chat') === currentView)
    .sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));

  if(visible.length === 0){
    tape.innerHTML = currentView === 'telegram'
      ? `<div class="empty-state">— 線路已接通 —<br>還沒有任何電文<br>打下第一封暗號訊息吧</div>`
      : `<div class="empty-state">— 聊天室是空的 —<br>說點什麼吧</div>`;
    return;
  }

  let html = '';
  visible.forEach((m, idx) => {
    const isSelf = m.sender === currentUser;
    const rowClass = isSelf ? 'self' : 'other';

    let replyHTML = '';
    if(m.replyTo){
      const target = findMessage(m.replyTo);
      if(target && target.status === 'active'){
        const preview = target.text.slice(0, 10);
        replyHTML = `<div class="reply-chip" data-jump="${target.id}">↩ ${target.sender}：${escapeHTML(preview)}${target.text.length>10?'…':''}</div>`;
      }else{
        replyHTML = `<div class="reply-chip">↩ [ 原訊號已消失 ]</div>`;
      }
    }

    let bodyHTML = '';
    if(m.status === 'unsent'){
      bodyHTML = `<div class="bubble system-text">[ 訊號已被發報者截斷 ]</div>`;
    }else if(m.status === 'destroyed'){
      bodyHTML = `<div class="bubble system-text">[ 訊號已銷毀 ]</div>`;
    }else{
      bodyHTML = `<div class="bubble"><div class="glyph-row">${renderCipherHTML(m.text)}</div></div>`;
    }

    let footHTML = '';
    const parts = [];
    if(isSelf && m.status === 'active'){
      parts.push(`<span class="read-dot ${m.isRead ? 'read':'unread'}"></span>`);
    }
    if(m.isSaved && m.status === 'active'){
      parts.push(`<span class="stamp">KEEP</span>`);
    }
    if(m.isEdited && m.status === 'active'){
      parts.push(`<span class="edited-tag">(已修正)</span>`);
    }
    if(parts.length){
      footHTML = `<div class="foot-line">${parts.join('')}</div>`;
    }

    let actionsHTML = '';
    if(m.status === 'active'){
      const acts = [];
      acts.push(`<button class="act-btn" data-act="reply" data-id="${m.id}">回覆</button>`);
      if(m.mode === 'telegram'){
        acts.push(`<button class="act-btn" data-act="save" data-id="${m.id}">${m.isSaved ? '取消存檔':'存檔'}</button>`);
      }
      if(isSelf){
        acts.push(`<button class="act-btn" data-act="edit" data-id="${m.id}">編輯</button>`);
        acts.push(`<button class="act-btn" data-act="unsend" data-id="${m.id}">收回</button>`);
      }
      acts.push(`<button class="act-btn" data-act="delete" data-id="${m.id}">刪除</button>`);
      actionsHTML = `<div class="actions">${acts.join('')}</div>`;
    }else{
      actionsHTML = `<div class="actions"><button class="act-btn" data-act="delete" data-id="${m.id}">刪除</button></div>`;
    }

    const isNewRow = !knownIds.has(m.id) ? ' new-in' : '';
    html += `<div class="row ${rowClass}${isNewRow}" id="msg-${m.id}">
      <div class="meta-line">${seqLabel(idx, m.mode)} · ${fmtTime(m.timestamp)}</div>
      ${replyHTML}
      ${bodyHTML}
      ${footHTML}
      ${actionsHTML}
    </div>`;
  });

  const hadNoScroll = tape.scrollHeight - tape.scrollTop - tape.clientHeight < 40;
  tape.innerHTML = html;
  if(hadNoScroll) tape.scrollTop = tape.scrollHeight;
  knownIds = new Set(visible.map(m => m.id));
  bindRowEvents();
}

function bindRowEvents(){
  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', onAction);
  });
  document.querySelectorAll('.reply-chip[data-jump]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const target = document.getElementById('msg-' + chip.dataset.jump);
      if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  // touch long-press reveal for glyphs
  document.querySelectorAll('.glyph[data-letter]').forEach(g=>{
    let timer = null;
    g.addEventListener('touchstart', (e)=>{
      timer = setTimeout(()=> g.classList.add('reveal'), 200);
    }, {passive:true});
    g.addEventListener('touchend', ()=>{
      clearTimeout(timer);
      setTimeout(()=> g.classList.remove('reveal'), 500);
    });
  });
}

async function onAction(e){
  const btn = e.currentTarget;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  const m = findMessage(id);
  if(!m) return;

  if(act === 'reply'){
    replyTarget = m;
    editTarget = null;
    showContextBar('reply', m.text.slice(0,24) + (m.text.length>24?'…':''));
    document.getElementById('text-input').focus();
  }else if(act === 'save'){
    await updateDocSafe(m.id, { isSaved: !m.isSaved });
  }else if(act === 'edit'){
    editTarget = m;
    replyTarget = null;
    document.getElementById('text-input').value = m.text;
    updatePreview();
    showContextBar('edit', '編輯這則電文');
    document.getElementById('text-input').focus();
  }else if(act === 'unsend'){
    if(confirm('確定要收回這則電文嗎？')){
      await updateDocSafe(m.id, { status:'unsent', text:'' });
    }
  }else if(act === 'delete'){
    if(confirm('確定要永久刪除這則電文嗎？此動作無法復原。')){
      try{ await window.__fb.deleteDoc(msgDoc(m.id)); }
      catch(e){ console.error('delete failed', e); }
    }
  }
}

function showContextBar(mode, text){
  const bar = document.getElementById('context-bar');
  const label = document.getElementById('context-label');
  const txt = document.getElementById('context-text');
  label.textContent = mode === 'reply' ? '回覆：' : '編輯中：';
  txt.textContent = text;
  bar.style.display = 'flex';
}
function hideContextBar(){
  document.getElementById('context-bar').style.display = 'none';
  replyTarget = null;
  editTarget = null;
}

/* ---------------- input / preview ---------------- */
function updatePreview(){
  const val = document.getElementById('text-input').value;
  const preview = document.getElementById('preview-row');
  if(val.length === 0){
    preview.classList.add('empty');
    preview.innerHTML = '';
  }else{
    preview.classList.remove('empty');
    preview.innerHTML = renderCipherHTML(val);
  }
}

async function sendMessage(){
  const input = document.getElementById('text-input');
  const val = input.value.trim();
  if(!val) return;

  if(editTarget){
    await updateDocSafe(editTarget.id, { text: val, isEdited: true });
  }else{
    try{
      await window.__fb.addDoc(msgsRef(), {
        sender: currentUser,
        text: val,
        timestamp: new Date().toISOString(),
        isRead: false,
        readAt: null,
        isSaved: false,
        status: 'active',
        isEdited: false,
        mode: currentView,
        replyTo: replyTarget ? replyTarget.id : null
      });
    }catch(e){ console.error('send failed', e); }
  }

  input.value = '';
  input.style.height = 'auto';
  updatePreview();
  hideContextBar();
  playSendSound();
}

/* ---------------- presence ---------------- */
async function pingPresence(){
  try{ await window.__fb.setDoc(presenceDoc(currentUser), { lastSeen: Date.now() }); }
  catch(e){ /* ignore */ }
}
function startPresenceListener(){
  const other = OTHER[currentUser];
  unsubscribePresence = window.__fb.onSnapshot(presenceDoc(other), (snap)=>{
    const dot = document.getElementById('presence-dot');
    const data = snap.data();
    if(data && (Date.now() - Number(data.lastSeen) < 15000)){
      dot.className = 'dot online';
    }else{
      dot.className = 'dot alone';
    }
  });
}

/* ---------------- secret area enter / exit ---------------- */
let secretActive = false;
let secretBound = false;
let secretTimers = [];
let unsubscribePresence = null;

function enterSecret(){
  secretActive = true;
  if(typeof Water !== 'undefined') Water.stop();
  document.getElementById('chatapp').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('whoami-label').textContent = '身分：' + currentUser;
  buildCodebook();

  currentView = 'chat';
  knownIds = new Set();
  document.querySelectorAll('.tab-btn').forEach(t=> t.classList.toggle('active', t.dataset.mode === 'chat'));

  if(!secretBound){ secretBound = true; bindSecretUI(); }

  startMessagesListener();
  pingPresence();
  startPresenceListener();
  secretTimers.push(setInterval(pingPresence, 5000));
  secretTimers.push(setInterval(processLifecycle, 60000));
}

function exitSecret(){
  if(!secretActive) return;
  secretActive = false;
  if(unsubscribeMessages){ unsubscribeMessages(); unsubscribeMessages = null; }
  if(unsubscribePresence){ unsubscribePresence(); unsubscribePresence = null; }
  secretTimers.forEach(clearInterval);
  secretTimers = [];
  messages = [];
  knownIds = new Set();
  hideContextBar();
  document.getElementById('tape').innerHTML = '';
  document.getElementById('text-input').value = '';
  document.getElementById('preview-row').innerHTML = '';
  document.getElementById('preview-row').classList.add('empty');
  document.getElementById('codebook-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  if(typeof me !== 'undefined' && me) document.getElementById('chatapp').style.display = 'flex';
}

function bindSecretUI(){
  document.getElementById('logout-btn').addEventListener('click', exitSecret);
  attachDoubleTap(document.getElementById('tape'), exitSecret);

  const input = document.getElementById('text-input');
  input.addEventListener('compositionstart', ()=>{ isComposing = true; });
  input.addEventListener('compositionend', ()=>{ isComposing = false; });

    updatePreview();

    playKeyTick();
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey && !isComposing && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      sendMessage();

  });
  document.getElementById('send-btn').addEventListener('click', ()=>{

    sendMessage();

  document.getElementById('context-cancel').addEventListener('click', ()=>{
    hideContextBar();
    document.getElementById('text-input').value = '';

  });

    soundOn = !soundOn;

  });
  document.getElementById('codebook-btn').addEventListener('click', ()=>{
    document.getElementById('codebook-overlay').style.display = 'flex';
  });
  document.getElementById('codebook-close').addEventListener('click', ()=>{
    document.getElementById('codebook-overlay').style.display = 'none';
  });
  document.getElementById('codebook-overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'codebook-overlay') e.target.style.display = 'none';
  });

  document.querySelectorAll('.tab-btn').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      currentView = tab.dataset.mode;
      document.querySelectorAll('.tab-btn').forEach(t=> t.classList.toggle('active', t === tab));
      hideContextBar();
      document.getElementById('text-input').value = '';
      updatePreview();
      render();
    });
  });
}

/* ================= helpers ================= */
function attachDoubleTap(el, cb){
  let last = { t:0, x:0, y:0 };
  el.addEventListener('pointerup', (e)=>{
    if(e.target !== el) return;
    const now = Date.now();
    if(now - last.t < 400 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 30){
      last.t = 0;
      cb();
    }else{
      last = { t: now, x: e.clientX, y: e.clientY };
    }
  });
}

/* ================= secret-area password (PBKDF2) ================= */
const PW_SALT = "sc-salt-v2";
const PW_ITER = 150000;
const PW_HASH = "5d143eadf30ef55e4ad5359443cb30316a44fb11c5e6a57406e461a6ad025e78";

async function pwOk(pw){
  try{
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt: enc.encode(PW_SALT), iterations: PW_ITER, hash:'SHA-256' }, key, 256);
    const hex = [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,'0')).join('');
    return hex === PW_HASH;
  }catch(e){ return false; }
}

/* ================= calm water canvas + hidden gesture lock =================
   Everyone sees the same relaxing water page. Only the authorised accounts
   (currentUser !== null) get gesture recognition, and every failure is silent.
   Stage 1: draw the stick-figure pose (pause ~0.3s at each joint)
   Stage 2: tap three faint lights in order within 3 seconds
   Stage 3: type the password on an unlabeled glass keyboard                  */
function normFig(raw){
  const xs = raw.map(p => p[0]), ys = raw.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return raw.map(p => [(p[0]-x0)/(x1-x0), (p[1]-y0)/(y1-y0)]);
}
// Two strokes, in order: the pose of "A", then the pose of "E". Each list is the joints you pause on.
const FIG_LETTERS = ['A', 'E'];
const FIGS = [
  // A: left elbow -> neck -> right elbow -> neck -> hip -> left foot -> hip -> right foot
  normFig([[.27,.07],[.49,.33],[.65,.05],[.49,.33],[.47,.60],[.28,.84],[.47,.60],[.62,.82]]),
  // E: right hand -> neck -> left hand -> hip -> left foot -> hip -> bottom foot
  normFig([[.60,.20],[.42,.34],[.28,.27],[.41,.47],[.25,.65],[.41,.47],[.41,.80]])
];
const STROKE_GAP_MS = 6000;               // time allowed between the two strokes
const FIG_TOL = 0.22;                       // allowed error per joint (fraction of figure size)
const DWELL_MS = 300;                       // pause time that marks a joint
const TAP_SEQ = [[.16,.18],[.84,.82],[.84,.18]]; // fractions of canvas width/height, in order
const TAP_RADIUS = 64, TAP_WINDOW = 3000;

const Water = (function(){
  const cv = document.getElementById('water-canvas');
  const ctx = cv.getContext('2d');
  const kb = document.getElementById('glass-kb');
  const dbgEl = document.getElementById('water-dbg');
  let W = 0, H = 0, dpr = 1, parts = [], ripples = [];
  let raf = 0, running = false;
  let stage = 'idle', stageT = 0;
  let down = false, ptr = { x:0, y:0 };
  let nodes = [], anchor = null, anchorT = 0, anchorFlag = false, lastTrail = null;
  let tapIdx = 0, buf = '', kbTimer = 0, dbgDots = [], dbgUntil = 0;
  let figIdx = 0, strokeDeadline = 0;

  const dist = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);
  const gestureOn = ()=> !!currentUser;

  function resize(){
    const r = cv.parentElement.getBoundingClientRect();
    if(r.width === 0) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(parts.length === 0){
      for(let i=0;i<46;i++){
        parts.push({ x:Math.random()*W, y:Math.random()*H, r:2+Math.random()*5,
          a:.12+Math.random()*.22, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25,
          ph:Math.random()*6.28, teal:Math.random()<.4 });
      }
    }
  }

  function addRipple(x,y,max){ ripples.push({ x, y, r:4, max:max||60, a:.55 }); }

  /* ---------- gesture matching ---------- */
  function matchFigure(ns, tpl){
    if(ns.length < tpl.length || ns.length > tpl.length + 2) return { ok:false, why:'節點數 ' + ns.length + '（需要 ' + tpl.length + '）' };
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(const p of ns){ minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x); miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y); }
    const w = maxx-minx, h = maxy-miny;
    if(w < 80 || h < 80) return { ok:false, why:'圖形太小' };
    const norm = ns.map(p => ({ x:(p.x-minx)/w, y:(p.y-miny)/h }));
    let j = 0, maxd = 0;
    for(let i=0;i<tpl.length;i++){
      let found = false;
      while(j < norm.length){
        const d = Math.hypot(norm[j].x - tpl[i][0], norm[j].y - tpl[i][1]);
        j++;
        if(d <= FIG_TOL){ found = true; maxd = Math.max(maxd, d); break; }
      }
      if(!found) return { ok:false, why:'第 ' + (i+1) + ' 個關節位置不對' };
    }
    return { ok:true, maxd };
  }

  function setDbg(txt){
    if(!(location.hash === '#debug' && gestureOn())){ dbgEl.style.display = 'none'; return; }
    dbgEl.textContent = txt; dbgEl.style.display = 'block';
  }

  function finishStroke(p){
    if(nodes.length && dist(p, nodes[nodes.length-1]) > 24) nodes.push({ x:p.x, y:p.y });
    const idx = figIdx;
    const res = matchFigure(nodes, FIGS[idx]);
    if(location.hash === '#debug' && gestureOn()){
      dbgDots = nodes.slice(); dbgUntil = performance.now() + 2500;
      setDbg('第 ' + (idx+1) + ' 筆（' + FIG_LETTERS[idx] + '）：節點 ' + nodes.length + '/' + FIGS[idx].length + ' → ' +
        (res.ok ? '成功（最大誤差 ' + res.maxd.toFixed(2) + '，上限 ' + FIG_TOL + '）' : '失敗：' + res.why));
    }
    nodes = [];
    if(!res.ok){ figIdx = 0; return; }          // wrong pose: silently start over
    figIdx++;
    if(figIdx >= FIGS.length){ figIdx = 0; stage = 'converge'; stageT = performance.now(); }
    else strokeDeadline = performance.now() + STROKE_GAP_MS;
  }

  /* ---------- taps + keyboard ---------- */
  function handleTap(p){
    const t = TAP_SEQ[tapIdx];
    const target = { x:t[0]*W, y:t[1]*H };
    if(dist(p, target) <= TAP_RADIUS){
      addRipple(target.x, target.y, 54);
      tapIdx++;
      if(tapIdx >= TAP_SEQ.length) openKeyboard();
    }else{
      reset();
    }
  }
  function openKeyboard(){
    stage = 'keys'; buf = '';
    kb.classList.add('show');
    clearTimeout(kbTimer);
    kbTimer = setTimeout(reset, 25000);
  }
  async function submitPw(){
    const pw = buf; buf = '';
    const ok = await pwOk(pw);
    reset();
    if(ok) enterSecret();
  }
  function press(k){
    if(stage !== 'keys') return;
    clearTimeout(kbTimer);
    kbTimer = setTimeout(reset, 25000);
    if(k === 'bs') buf = buf.slice(0,-1);
    else if(k === 'enter') submitPw();
    else if(buf.length < 64) buf += k;
  }

  function reset(){
    clearTimeout(kbTimer);
    const wasActive = stage !== 'idle';
    stage = 'idle'; tapIdx = 0; buf = ''; nodes = []; down = false; figIdx = 0;
    kb.classList.remove('show');
    if(wasActive) addRipple(W/2, H/2, Math.max(W,H)*0.6);   // the lock just dissolves like a wave
  }

  /* ---------- loop ---------- */
  function tick(now){
    if(!running) return;
    raf = requestAnimationFrame(tick);
    if(W === 0){ resize(); return; }

    // dwell detection (finger resting) → joint
    if(down && stage === 'idle' && gestureOn() && !anchorFlag && anchor && now - anchorT >= DWELL_MS){
      anchorFlag = true;
      if(!nodes.length || dist(anchor, nodes[nodes.length-1]) > 24) nodes.push({ x:anchor.x, y:anchor.y });
      addRipple(anchor.x, anchor.y, 42);
    }

    if(figIdx > 0 && stage === 'idle' && !down && now > strokeDeadline) figIdx = 0;

    ctx.clearRect(0,0,W,H);

    // particles
    for(const p of parts){
      p.ph += 0.01;
      p.x += p.vx + Math.sin(p.ph)*0.12;
      p.y += p.vy + Math.cos(p.ph*0.8)*0.12;
      if(stage === 'converge'){ p.x += (W/2 - p.x)*0.05; p.y += (H/2 - p.y)*0.05; }
      if(down){
        const dx = p.x - ptr.x, dy = p.y - ptr.y, d = Math.hypot(dx,dy);
        if(d < 90 && d > 0.1){ p.x += dx/d * (90-d)*0.06; p.y += dy/d * (90-d)*0.06; }
      }
      if(p.x < -10) p.x = W+10; if(p.x > W+10) p.x = -10;
      if(p.y < -10) p.y = H+10; if(p.y > H+10) p.y = -10;
      ctx.beginPath();
      ctx.fillStyle = p.teal ? 'rgba(60,130,130,' + (p.a*0.7) + ')' : 'rgba(255,255,255,' + p.a + ')';
      ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fill();
    }

    // ripples
    for(let i=ripples.length-1;i>=0;i--){
      const r = ripples[i];
      r.r += (r.max - r.r)*0.06 + 0.4;
      r.a *= 0.955;
      if(r.a < 0.015 || r.r >= r.max){ ripples.splice(i,1); continue; }
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,' + r.a + ')';
      ctx.lineWidth = 1.5;
      ctx.arc(r.x, r.y, r.r, 0, 6.283);
      ctx.stroke();
    }

    // stage visuals
    if(stage === 'converge'){
      const el = now - stageT;
      const a = Math.sin(Math.min(el/1100,1) * Math.PI) * 0.9;
      const bw = 90, bh = 150, oy = H/2 - bh/2;
      ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      FIGS.forEach((tpl, k)=>{
        const ox = W/2 + (k === 0 ? -bw - 12 : 12);
        ctx.beginPath();
        tpl.forEach((f,i)=>{ const x = ox + f[0]*bw, y = oy + f[1]*bh; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
        ctx.stroke();
      });
      if(el >= 1100){ stage = 'taps'; stageT = now; tapIdx = 0; }
    }else if(stage === 'taps'){
      const el = now - stageT;
      if(el > TAP_WINDOW){ reset(); }
      else{
        const remain = 1 - el/TAP_WINDOW;
        for(let i=tapIdx;i<TAP_SEQ.length;i++){
          const x = TAP_SEQ[i][0]*W, y = TAP_SEQ[i][1]*H;
          const a = 0.55 * remain * (0.75 + 0.25*Math.sin(now/180 + i));
          const g = ctx.createRadialGradient(x,y,0,x,y,46);
          g.addColorStop(0, 'rgba(255,255,255,' + a + ')');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x,y,46,0,6.283); ctx.fill();
        }
      }
    }

    // debug dots
    if(now < dbgUntil){
      ctx.fillStyle = 'rgba(226,86,74,.8)';
      dbgDots.forEach(d => { ctx.beginPath(); ctx.arc(d.x,d.y,5,0,6.283); ctx.fill(); });
    }
  }

  /* ---------- pointer input ---------- */
  function pt(e){
    const r = cv.getBoundingClientRect();
    return { x:e.clientX - r.left, y:e.clientY - r.top, t:performance.now() };
  }
  cv.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const p = pt(e);
    ptr = p;
    addRipple(p.x, p.y, 34);
    if(stage === 'taps' && gestureOn()){ handleTap(p); return; }
    if(stage !== 'idle') return;
    down = true;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    nodes = [{ x:p.x, y:p.y }];
    anchor = p; anchorT = p.t; anchorFlag = false; lastTrail = p;
    if(figIdx === 0) setDbg('');
  });
  cv.addEventListener('pointermove', (e)=>{
    if(!down) return;
    const p = pt(e);
    ptr = p;
    if(lastTrail && dist(p, lastTrail) > 38){ addRipple(p.x, p.y, 26); lastTrail = p; }
    if(anchor && dist(p, anchor) > 14){ anchor = p; anchorT = p.t; anchorFlag = false; }
  });
  function up(e){
    if(!down) return;
    down = false;
    if(stage === 'idle' && gestureOn()) finishStroke(pt(e));
    else nodes = [];
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', ()=>{ down = false; nodes = []; });

  /* ---------- keyboard ---------- */
  (function buildKb(){
    const rows = ['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'];
    let html = '';
    rows.forEach((row, idx)=>{
      html += '<div class="kb-row">';
      for(const ch of row) html += '<button class="kb-key" tabindex="-1" data-k="' + ch + '"></button>';
      if(idx === 3){
        html += '<button class="kb-key wide" tabindex="-1" data-k="bs"></button>';
        html += '<button class="kb-key wide" tabindex="-1" data-k="enter"></button>';
      }
      html += '</div>';
    });
    kb.innerHTML = html;
    kb.addEventListener('pointerdown', (e)=>{
      const k = e.target.closest('.kb-key');
      if(!k) return;
      e.preventDefault();
      k.classList.add('on');
      setTimeout(()=> k.classList.remove('on'), 140);
      press(k.dataset.k);
    });
  })();
  document.addEventListener('keydown', (e)=>{
    if(stage !== 'keys' || e.isComposing) return;
    if(e.key === 'Escape'){ reset(); return; }
    if(e.key === 'Enter'){ e.preventDefault(); press('enter'); }
    else if(e.key === 'Backspace'){ e.preventDefault(); press('bs'); }
    else if(e.key.length === 1 && /[a-z0-9]/i.test(e.key)){ e.preventDefault(); press(e.key.toLowerCase()); }
  });

  window.addEventListener('resize', ()=>{ if(running){ parts = []; resize(); } });

  return {
    start(){
      if(running) return;
      running = true; parts = []; ripples = [];
      requestAnimationFrame(()=>{ resize(); raf = requestAnimationFrame(tick); });
    },
    stop(){
      running = false; cancelAnimationFrame(raf);
      stage = 'idle'; tapIdx = 0; buf = ''; nodes = []; down = false; figIdx = 0;
      clearTimeout(kbTimer); kb.classList.remove('show'); setDbg('');
    },
    reset
  };
})();

/* ================= Messenger ================= */
let me = null;            // { uid, handle, nickname }
let authUser = null;
let profileCache = {};
let profilePending = new Set();
let convs = [];
let activeConvId = null;
let msgs = [];
let myBlocks = new Set();
let unsubConvs = null, unsubMsgs = null, unsubBlocks = null;
let chatInitial = true, chatKnownIds = new Set();
let chatReply = null, chatEdit = null, chatComposing = false, chatBound = false;
let listFilter = '';
let ncComposing = false;

const $ = (id) => document.getElementById(id);
const F = () => window.__fb;
const userDoc = (uid) => F().doc(F().db, 'users', uid);
const convCol = () => F().collection(F().db, 'conversations');
const convDoc = (id) => F().doc(F().db, 'conversations', id);
const msgCol = (cid) => F().collection(F().db, 'conversations', cid, 'messages');
const msgRef = (cid, mid) => F().doc(F().db, 'conversations', cid, 'messages', mid);

function initial(name){ return (name || '?').trim().charAt(0).toUpperCase() || '?'; }
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.opacity = '0'; }, 2600);
}

function showScreen(name){
  ['setup','list','chat','water'].forEach(n => $('scr-' + n).classList.toggle('show', n === name));
  const tb = $('tabbar');
  tb.style.display = (name === 'list' || name === 'water') ? 'flex' : 'none';
  tb.querySelectorAll('.tab-nav').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  if(name === 'water') Water.start(); else Water.stop();
}

/* ---------- profiles ---------- */
function profileOf(uid){ return profileCache[uid] || null; }
async function loadProfile(uid){
  if(profileCache[uid] || profilePending.has(uid)) return;
  profilePending.add(uid);
  try{
    const s = await F().getDoc(userDoc(uid));
    profileCache[uid] = s.exists() ? s.data() : { nickname:'（已停用）', handle:'' };
  }catch(e){
    profileCache[uid] = { nickname:'未知使用者', handle:'' };
  }
  profilePending.delete(uid);
  renderConvList();
  if(activeConvId){ renderChatHeader(); if(msgs.length) renderChat(); }
}
function nameOf(uid){
  const p = profileOf(uid);
  if(!p){ loadProfile(uid); return '…'; }
  return p.nickname;
}

/* ---------- first-login setup ---------- */
function showSetup(){
  $('gate').style.display = 'none';
  $('chatapp').style.display = 'flex';
  if(!chatBound){ chatBound = true; bindMessengerUI(); }
  showScreen('setup');
}
async function submitSetup(){
  const nick = $('su-nick').value.trim();
  const handle = $('su-handle').value.trim().toLowerCase();
  const err = $('su-error');
  err.textContent = '';
  if(nick.length < 1 || nick.length > 20){ err.textContent = '暱稱需要 1–20 個字。'; return; }
  if(!/^[a-z0-9_]{3,20}$/.test(handle)){ err.textContent = 'ID 只能用英文小寫、數字、底線，3–20 個字。'; return; }
  const { db, doc, writeBatch } = F();
  const batch = writeBatch(db);
  batch.set(doc(db, 'handles', handle), { uid: authUser.uid });
  batch.set(doc(db, 'users', authUser.uid), { handle, nickname: nick, createdAt: new Date().toISOString() });
  try{
    await batch.commit();
    me = { uid: authUser.uid, handle, nickname: nick };
    startMessenger();
  }catch(e){
    err.textContent = '這個 ID 已經有人使用了，或發生錯誤（' + (e.code || e.message) + '）。';
  }
}

/* ---------- start / stop ---------- */
function startMessenger(){
  $('gate').style.display = 'none';
  if(!secretActive) $('chatapp').style.display = 'flex';
  $('me-avatar').textContent = initial(me.nickname);
  $('me-handle').textContent = '@' + me.handle;
  profileCache[me.uid] = me;
  if(!chatBound){ chatBound = true; bindMessengerUI(); }
  showScreen('list');

  [unsubConvs, unsubBlocks].forEach(u => u && u());
  const { onSnapshot, query, where, collection, db } = F();
  unsubConvs = onSnapshot(query(convCol(), where('members', 'array-contains', me.uid)), (snap)=>{
    convs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderConvList();
    if(activeConvId){ renderChatHeader(); markRead(); }
  }, (err)=> console.error('convs listener', err));
  unsubBlocks = onSnapshot(collection(db, 'users', me.uid, 'blocks'), (snap)=>{
    myBlocks = new Set(snap.docs.map(d => d.id));
    if(activeConvId) renderChatHeader();
  }, ()=>{});
}

function stopAll(){
  [unsubConvs, unsubMsgs, unsubBlocks].forEach(u => u && u());
  unsubConvs = unsubMsgs = unsubBlocks = null;
  exitSecret();
  Water.stop();
  convs = []; msgs = []; activeConvId = null; profileCache = {}; myBlocks = new Set();
  chatReply = null; chatEdit = null;
  $('conv-list').innerHTML = '';
  $('cn-tape').innerHTML = '';
  $('chatapp').style.display = 'none';
  $('app').style.display = 'none';
  $('newchat-overlay').style.display = 'none';
  $('members-overlay').style.display = 'none';
  $('gate').style.display = 'flex';
}

/* ---------- conversation list ---------- */
function fmtListTime(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  if(d.toDateString() === now.toDateString()) return fmtTime(iso);
  return (d.getMonth()+1) + '/' + d.getDate();
}
function isUnread(c){
  if(!c.lastMessage || c.lastMessage.senderUid === me.uid) return false;
  const lr = (c.lastRead || {})[me.uid];
  return !lr || lr < c.lastMessage.at;
}
function renderConvList(){
  if(!me) return;
  const el = $('conv-list');
  let rows = convs
    .filter(c => c.type === 'room' || c.lastMessage || c.createdBy === me.uid)
    .map(c => ({ c, isRoom: c.type === 'room', other: c.members.find(u => u !== me.uid) || me.uid }));
  const q = listFilter.trim().toLowerCase();
  if(q){
    rows = rows.filter(r => {
      if(r.isRoom) return (r.c.name || '').toLowerCase().includes(q);
      const p = profileOf(r.other) || {};
      return (p.nickname || '').toLowerCase().includes(q) || (p.handle || '').includes(q);
    });
  }
  rows.sort((a,b) => (b.c.lastAt || '').localeCompare(a.c.lastAt || ''));
  if(rows.length === 0){
    el.innerHTML = '<div class="cn-empty">' + (q ? '找不到符合的聊天' : '還沒有聊天，按右上角 ✎ 找朋友，或建立、加入聊天室吧') + '</div>';
    return;
  }
  el.innerHTML = rows.map(({c, other, isRoom}) => {
    const nm = isRoom ? c.name : nameOf(other);
    const lm = c.lastMessage;
    let preview = isRoom ? '（還沒有訊息）' : '（尚未傳送訊息）';
    if(lm){
      const who = lm.senderUid === me.uid ? '你：' : (isRoom ? nameOf(lm.senderUid) + '：' : '');
      preview = escapeHTML(who + lm.text);
    }
    const unread = isUnread(c);
    return `<div class="conv-row${unread ? ' unread' : ''}" data-cid="${c.id}">
      <div class="cn-avatar big${isRoom ? ' room' : ''}">${isRoom ? '#' : escapeHTML(initial(nm))}</div>
      <div class="conv-main"><div class="conv-name">${escapeHTML(nm)}</div><div class="conv-last">${preview}</div></div>
      <div class="conv-side"><div class="conv-time">${fmtListTime(c.lastAt)}</div>${unread ? '<span class="unread-dot"></span>' : ''}</div>
    </div>`;
  }).join('');
}

/* ---------- open / close a conversation ---------- */
function activeConv(){ return convs.find(x => x.id === activeConvId) || null; }
function otherOfActive(){
  const c = activeConv();
  return (c && c.type !== 'room') ? c.members.find(u => u !== me.uid) : null;
}
function renderChatHeader(){
  const c = activeConv();
  if(!c) return;
  const isRoom = c.type === 'room';
  $('cm-block').style.display = isRoom ? 'none' : 'block';
  $('cm-members').style.display = isRoom ? 'block' : 'none';
  $('cm-invite').style.display = isRoom ? 'block' : 'none';
  $('cm-leave').style.display = isRoom ? 'block' : 'none';
  $('cn-avatar').classList.toggle('room', isRoom);
  if(isRoom){
    $('cn-title').textContent = c.name;
    $('cn-avatar').textContent = '#';
    $('cn-sub').textContent = c.members.length + ' 位成員 · ' + (c.visibility === 'public' ? '公開' : '私人');
    return;
  }
  const other = otherOfActive();
  if(!other) return;
  const nm = nameOf(other), p = profileOf(other);
  $('cn-title').textContent = nm;
  $('cn-avatar').textContent = initial(nm);
  $('cn-sub').textContent = p && p.handle ? '@' + p.handle : '';
  $('cm-block').textContent = myBlocks.has(other) ? '解除封鎖' : '封鎖此人';
}
function openConv(cid){
  activeConvId = cid; msgs = [];
  chatInitial = true; chatKnownIds = new Set();
  chatReply = null; chatEdit = null;
  hideChatCtx(); $('cn-input').value = ''; $('cn-input').style.height = 'auto';
  $('cn-tape').innerHTML = '';
  showScreen('chat');
  renderChatHeader();
  const { onSnapshot, query, orderBy, limitToLast } = F();
  if(unsubMsgs) unsubMsgs();
  unsubMsgs = onSnapshot(query(msgCol(cid), orderBy('at'), limitToLast(100)), (snap)=>{
    msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderChat();
    markRead();
  }, (err)=> console.error('msgs listener', err));
}
function closeConv(){
  if(unsubMsgs){ unsubMsgs(); unsubMsgs = null; }
  activeConvId = null; msgs = [];
  $('cn-tape').innerHTML = '';
  $('chatmenu').style.display = 'none';
  hideChatCtx();
  showScreen('list');
}
function markRead(){
  const c = convs.find(x => x.id === activeConvId);
  if(!c || !c.lastMessage || c.lastMessage.senderUid === me.uid) return;
  const lr = (c.lastRead || {})[me.uid];
  if(lr && lr >= c.lastMessage.at) return;
  F().updateDoc(convDoc(c.id), { ['lastRead.' + me.uid]: new Date().toISOString() }).catch(()=>{});
}

/* ---------- message tape ---------- */
function renderChat(){
  const tape = $('cn-tape');
  const nearBottom = tape.scrollHeight - tape.scrollTop - tape.clientHeight < 80;
  if(msgs.length === 0){
    tape.innerHTML = '<div class="cn-empty">還沒有訊息，說聲嗨吧 👋</div>';
    chatInitial = false;
    return;
  }
  const _c = activeConv();
  const isRoom = !!_c && _c.type === 'room';
  let html = '', prevDay = '', lastSelf = false;
  for(const m of msgs){
    const self = m.senderUid === me.uid;
    lastSelf = self;
    const day = new Date(m.at).toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });
    if(day !== prevDay){ html += `<div class="cn-day">${day}</div>`; prevDay = day; }
    let chip = '';
    if(m.replyTo){
      const t = msgs.find(x => x.id === m.replyTo);
      chip = t
        ? `<div class="cn-reply" data-jump="${t.id}">↩ ${t.senderUid === me.uid ? '你' : escapeHTML(nameOf(t.senderUid))}：${escapeHTML(t.text.slice(0,20))}${t.text.length > 20 ? '…' : ''}</div>`
        : `<div class="cn-reply">↩ 原訊息已刪除</div>`;
    }
    const isNew = (!chatInitial && !chatKnownIds.has(m.id)) ? ' new-in' : '';
    const acts = [`<button class="act-btn" data-cact="reply" data-id="${m.id}">回覆</button>`];
    if(self){
      acts.push(`<button class="act-btn" data-cact="edit" data-id="${m.id}">編輯</button>`);
      acts.push(`<button class="act-btn" data-cact="delete" data-id="${m.id}">刪除</button>`);
    }
    html += `<div class="cn-row ${self ? 'self' : 'other'}${isNew}" id="cm-${m.id}">
      ${(!self && isRoom) ? '<div class="cn-sender">' + escapeHTML(nameOf(m.senderUid)) + '</div>' : ''}
      ${chip}
      <div class="cn-bubble">${escapeHTML(m.text)}</div>
      <div class="cn-meta">${fmtTime(m.at)}${m.isEdited ? ' · 已編輯' : ''}</div>
      <div class="cn-actions">${acts.join('')}</div>
    </div>`;
  }
  tape.innerHTML = html;
  if(chatInitial || nearBottom || lastSelf) tape.scrollTop = tape.scrollHeight;
  chatKnownIds = new Set(msgs.map(m => m.id));
  chatInitial = false;
}

function showChatCtx(label, text){
  $('cn-ctx-label').textContent = label;
  $('cn-ctx-text').textContent = text;
  $('cn-ctx').style.display = 'flex';
}
function hideChatCtx(){
  $('cn-ctx').style.display = 'none';
  chatReply = null; chatEdit = null;
}

async function sendChat(){
  if(!activeConvId) return;
  const input = $('cn-input');
  const val = input.value.trim();
  if(!val) return;
  if(val.length > 2000){ toast('訊息太長了（上限 2000 字）'); return; }
  const other = otherOfActive();
  if(other && myBlocks.has(other)){ toast('你已封鎖對方，解除封鎖後才能傳訊息'); return; }
  const now = new Date().toISOString();
  try{
    if(chatEdit){
      await F().updateDoc(msgRef(activeConvId, chatEdit.id), { text: val, isEdited: true });
    }else{
      const ref = F().doc(msgCol(activeConvId));
      const batch = F().writeBatch(F().db);
      batch.set(ref, { senderUid: me.uid, text: val, at: now, isEdited: false, replyTo: chatReply ? chatReply.id : null });
      batch.update(convDoc(activeConvId), {
        lastMessage: { text: val.slice(0, 80), senderUid: me.uid, at: now },
        lastAt: now,
        ['lastRead.' + me.uid]: now
      });
      await batch.commit();
    }
  }catch(e){
    console.error('send failed', e);
    toast('無法傳送這則訊息');
    return;
  }
  input.value = ''; input.style.height = 'auto';
  hideChatCtx();
}

async function toggleBlock(){
  const other = otherOfActive();
  if(!other) return;
  const { db, doc, setDoc, deleteDoc } = F();
  const ref = doc(db, 'users', me.uid, 'blocks', other);
  try{
    if(myBlocks.has(other)){ await deleteDoc(ref); toast('已解除封鎖'); }
    else{
      if(!confirm('封鎖之後，對方就不能再傳訊息給你。確定嗎？')) return;
      await setDoc(ref, { at: new Date().toISOString() });
      toast('已封鎖');
    }
  }catch(e){ toast('操作失敗'); }
  $('chatmenu').style.display = 'none';
}

/* ---------- new chat / rooms ---------- */
let exRooms = [];
function ncTab(name){
  ['find','create','explore'].forEach(n => { $('nc-' + n).style.display = (n === name) ? 'block' : 'none'; });
  document.querySelectorAll('.nc-tab').forEach(b => b.classList.toggle('active', b.dataset.nc === name));
  if(name === 'explore') loadExplore();
  if(name === 'find') setTimeout(()=> $('nc-input').focus(), 50);
  if(name === 'create') setTimeout(()=> $('rm-name').focus(), 50);
}
function openNewChat(tab){
  $('newchat-overlay').style.display = 'flex';
  $('nc-input').value = ''; $('nc-msg').textContent = ''; $('nc-result').innerHTML = '';
  $('rm-name').value = ''; $('rm-msg').textContent = '';
  ncTab(tab || 'find');
}
function closeNewChat(){ $('newchat-overlay').style.display = 'none'; }

async function ncSearch(){
  const h = $('nc-input').value.trim().toLowerCase().replace(/^@/, '');
  const msg = $('nc-msg'), res = $('nc-result');
  msg.textContent = ''; res.innerHTML = '';
  if(!/^[a-z0-9_]{3,20}$/.test(h)){ msg.textContent = 'ID 是 3–20 個英文小寫、數字或底線。'; return; }
  try{
    const hs = await F().getDoc(F().doc(F().db, 'handles', h));
    if(!hs.exists()){ msg.textContent = '找不到這個 ID。'; return; }
    const uid = hs.data().uid;
    if(uid === me.uid){ msg.textContent = '這是你自己的 ID 😄'; return; }
    const us = await F().getDoc(userDoc(uid));
    if(!us.exists()){ msg.textContent = '找不到這個使用者。'; return; }
    profileCache[uid] = us.data();
    res.innerHTML = `<div class="conv-row" data-uid="${uid}">
      <div class="cn-avatar big">${escapeHTML(initial(us.data().nickname))}</div>
      <div class="conv-main"><div class="conv-name">${escapeHTML(us.data().nickname)}</div><div class="conv-last">@${escapeHTML(us.data().handle)}</div></div>
      <div class="conv-side"><div class="conv-time">開始聊天 ›</div></div>
    </div>`;
  }catch(e){ msg.textContent = '搜尋失敗（' + (e.code || e.message) + '）。'; }
}
async function startDm(uid){
  const id = [me.uid, uid].sort().join('_');
  if(!convs.find(c => c.id === id)){
    const now = new Date().toISOString();
    try{
      await F().setDoc(convDoc(id), {
        type:'dm', members:[me.uid, uid].sort(), createdBy: me.uid, createdAt: now,
        lastMessage: null, lastAt: now, lastRead: {}
      });
    }catch(e){ toast('無法開始這個聊天'); return; }
  }
  closeNewChat();
  openConv(id);
}

async function createRoom(){
  const name = $('rm-name').value.trim();
  const vis = document.querySelector('input[name="rmvis"]:checked').value;
  const msg = $('rm-msg');
  msg.textContent = '';
  if(name.length < 1 || name.length > 40){ msg.textContent = '聊天室名稱需要 1–40 個字。'; return; }
  const { db, doc, writeBatch } = F();
  const now = new Date().toISOString();
  const ref = doc(convCol());
  const batch = writeBatch(db);
  batch.set(ref, {
    type:'room', name, visibility: vis, members:[me.uid], createdBy: me.uid, createdAt: now,
    lastMessage: null, lastAt: now, lastRead: {}
  });
  if(vis === 'public') batch.set(doc(db, 'publicRooms', ref.id), { name, createdBy: me.uid, createdAt: now });
  try{
    await batch.commit();
    closeNewChat();
    openConv(ref.id);
  }catch(e){ msg.textContent = '建立失敗（' + (e.code || e.message) + '）。'; }
}

async function loadExplore(){
  const msg = $('ex-msg');
  msg.textContent = '載入中…'; $('ex-list').innerHTML = '';
  try{
    const { getDocs, query, collection, db, limit } = F();
    const snap = await getDocs(query(collection(db, 'publicRooms'), limit(60)));
    exRooms = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    msg.textContent = '';
    renderExplore();
  }catch(e){ msg.textContent = '載入失敗（' + (e.code || e.message) + '）。'; }
}
function renderExplore(){
  const q = $('ex-filter').value.trim().toLowerCase();
  const rows = exRooms.filter(r => !q || (r.name || '').toLowerCase().includes(q));
  $('ex-list').innerHTML = rows.length ? rows.map(r => {
    const joined = convs.some(c => c.id === r.id);
    return `<div class="conv-row" data-rid="${r.id}">
      <div class="cn-avatar big room">#</div>
      <div class="conv-main"><div class="conv-name">${escapeHTML(r.name || '')}</div><div class="conv-last">公開聊天室</div></div>
      <div class="conv-side"><div class="conv-time">${joined ? '進入 ›' : '加入 ›'}</div></div>
    </div>`;
  }).join('') : '<div class="cn-empty">目前沒有公開的聊天室</div>';
}
async function joinRoom(rid){
  if(!convs.some(c => c.id === rid)){
    try{ await F().updateDoc(convDoc(rid), { members: F().arrayUnion(me.uid) }); }
    catch(e){ toast('無法加入這個聊天室'); return; }
  }
  closeNewChat();
  openConv(rid);
}

async function showMembers(){
  const c = activeConv();
  if(!c || c.type !== 'room') return;
  $('chatmenu').style.display = 'none';
  $('members-overlay').style.display = 'flex';
  $('mb-list').innerHTML = '<div class="cn-empty">載入中…</div>';
  const list = c.members.slice(0, 60);
  await Promise.all(list.map(loadProfile));
  $('mb-list').innerHTML = list.map(uid => {
    const p = profileOf(uid) || {};
    return `<div class="conv-row"><div class="cn-avatar big">${escapeHTML(initial(p.nickname))}</div>
      <div class="conv-main"><div class="conv-name">${escapeHTML(p.nickname || '…')}${uid === c.createdBy ? ' 👑' : ''}</div><div class="conv-last">${p.handle ? '@' + escapeHTML(p.handle) : ''}</div></div></div>`;
  }).join('') + (c.members.length > 60 ? '<div class="cn-empty">…共 ' + c.members.length + ' 位成員</div>' : '');
}
async function inviteToRoom(){
  const c = activeConv();
  if(!c) return;
  $('chatmenu').style.display = 'none';
  const h = (prompt('輸入要邀請的使用者 ID') || '').trim().toLowerCase().replace(/^@/, '');
  if(!h) return;
  if(!/^[a-z0-9_]{3,20}$/.test(h)){ toast('ID 格式不正確'); return; }
  try{
    const hs = await F().getDoc(F().doc(F().db, 'handles', h));
    if(!hs.exists()){ toast('找不到這個 ID'); return; }
    const uid = hs.data().uid;
    if(c.members.includes(uid)){ toast('對方已經在聊天室裡了'); return; }
    await F().updateDoc(convDoc(c.id), { members: F().arrayUnion(uid) });
    toast('已邀請');
  }catch(e){ toast('邀請失敗'); }
}
async function leaveRoom(){
  const c = activeConv();
  if(!c) return;
  $('chatmenu').style.display = 'none';
  if(!confirm('要離開「' + c.name + '」嗎？')) return;
  const id = c.id;
  closeConv();
  try{ await F().updateDoc(convDoc(id), { members: F().arrayRemove(me.uid) }); toast('已離開聊天室'); }
  catch(e){ toast('離開失敗'); }
}

/* ---------- UI wiring ---------- */
function bindMessengerUI(){
  const input = $('cn-input');
  input.addEventListener('compositionstart', ()=>{ chatComposing = true; });
  input.addEventListener('compositionend', ()=>{ chatComposing = false; });
  input.addEventListener('input', ()=>{
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey && !chatComposing && !e.isComposing && e.keyCode !== 229){
      e.preventDefault(); sendChat();
    }
  });
  $('cn-send').addEventListener('click', sendChat);
  $('cn-ctx-cancel').addEventListener('click', ()=>{ hideChatCtx(); input.value = ''; });

  $('cn-tape').addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-cact]');
    if(btn){
      const m = msgs.find(x => x.id === btn.dataset.id);
      if(!m) return;
      const act = btn.dataset.cact;
      if(act === 'reply'){
        chatReply = m; chatEdit = null;
        showChatCtx('回覆：', m.text.slice(0,24) + (m.text.length > 24 ? '…' : ''));
        input.focus();
      }else if(act === 'edit'){
        chatEdit = m; chatReply = null;
        input.value = m.text;
        showChatCtx('編輯中：', '修改這則訊息');
        input.focus();
      }else if(act === 'delete'){
        if(confirm('要刪除這則訊息嗎？')){
          try{ await F().deleteDoc(msgRef(activeConvId, m.id)); }catch(err){ toast('刪除失敗'); }
        }
      }
      return;
    }
    const chip = e.target.closest('.cn-reply[data-jump]');
    if(chip){
      const t = $('cm-' + chip.dataset.jump);
      if(t) t.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    const row = e.target.closest('.cn-row');
    if(row){
      const wasOpen = row.classList.contains('open');
      $('cn-tape').querySelectorAll('.cn-row.open').forEach(r => r.classList.remove('open'));
      if(!wasOpen) row.classList.add('open');
    }
  });

  $('btn-back').addEventListener('click', closeConv);
  $('btn-chatmenu').addEventListener('click', (e)=>{
    e.stopPropagation();
    const m = $('chatmenu');
    m.style.display = m.style.display === 'block' ? 'none' : 'block';
  });
  document.addEventListener('click', ()=>{ $('chatmenu').style.display = 'none'; });
  $('cm-block').addEventListener('click', toggleBlock);
  $('cm-members').addEventListener('click', showMembers);
  $('cm-invite').addEventListener('click', inviteToRoom);
  $('cm-leave').addEventListener('click', leaveRoom);

  $('btn-newchat').addEventListener('click', ()=> openNewChat('find'));
  document.querySelectorAll('.nc-tab').forEach(b => b.addEventListener('click', ()=> ncTab(b.dataset.nc)));
  $('rm-create').addEventListener('click', createRoom);
  $('rm-name').addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); createRoom(); } });
  $('ex-filter').addEventListener('input', renderExplore);
  $('ex-list').addEventListener('click', (e)=>{
    const row = e.target.closest('.conv-row[data-rid]');
    if(row) joinRoom(row.dataset.rid);
  });
  $('members-overlay').addEventListener('click', (e)=>{ if(e.target.id === 'members-overlay') $('members-overlay').style.display = 'none'; });
  $('mb-close').addEventListener('click', ()=>{ $('members-overlay').style.display = 'none'; });
  $('newchat-overlay').addEventListener('click', (e)=>{ if(e.target.id === 'newchat-overlay') closeNewChat(); });
  $('nc-search').addEventListener('click', ncSearch);
  $('nc-input').addEventListener('compositionstart', ()=>{ ncComposing = true; });
  $('nc-input').addEventListener('compositionend', ()=>{ ncComposing = false; });
  $('nc-input').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !ncComposing && !e.isComposing){ e.preventDefault(); ncSearch(); }
  });
  $('nc-result').addEventListener('click', (e)=>{
    const row = e.target.closest('.conv-row[data-uid]');
    if(row) startDm(row.dataset.uid);
  });

  $('list-filter').addEventListener('input', (e)=>{ listFilter = e.target.value; renderConvList(); });
  $('conv-list').addEventListener('click', (e)=>{
    const row = e.target.closest('.conv-row[data-cid]');
    if(row) openConv(row.dataset.cid);
  });

  $('cn-signout').addEventListener('click', ()=>{
    if(confirm('要登出嗎？')) F().signOut(F().auth);
  });

  document.querySelectorAll('.tab-nav').forEach(b => b.addEventListener('click', ()=> showScreen(b.dataset.tab)));

  $('su-submit').addEventListener('click', submitSetup);
  ['su-nick','su-handle'].forEach(id => $(id).addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); submitSetup(); }
  }));
}

/* ================= Google sign-in ================= */
function showGateError(msg){
  const el = $('email-error');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}
function whenFirebase(cb){
  if(window.__fb) cb();
  else window.addEventListener('firebase-ready', cb, { once:true });
}

$('google-login').addEventListener('click', ()=>{
  whenFirebase(async ()=>{
    showGateError('');
    const { auth, GoogleAuthProvider, signInWithPopup } = F();
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });
    try{
      await signInWithPopup(auth, provider);
    }catch(e){
      if(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      if(e.code === 'auth/popup-blocked'){ showGateError('瀏覽器擋住了登入視窗，請允許彈出視窗後再試一次。'); return; }
      showGateError('登入失敗（' + (e.code || e.message) + '）');
    }
  });
});

whenFirebase(()=>{
  const { auth, onAuthStateChanged, signOut, getDoc } = F();
  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      authUser = null; me = null; currentUser = null;
      stopAll();
      return;
    }
    if(user.emailVerified === false){
      showGateError('這個 Google 帳號的信箱尚未驗證。');
      signOut(auth);
      return;
    }
    authUser = user;
    currentUser = resolveUserByEmail(user.email);   // secret-area identity, or null for everyone else
    try{
      const s = await getDoc(userDoc(user.uid));
      if(s.exists()){ me = { uid: user.uid, ...s.data() }; startMessenger(); }
      else showSetup();
    }catch(e){
      showGateError('讀取資料失敗（' + (e.code || e.message) + '），請確認 Firestore 規則已發布。');
    }
  });
});
</script>
